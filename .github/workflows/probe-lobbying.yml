name: Check lobbying data (one-off)

# Run by hand. Reads ILGA witness slip pages for a sample of bills and the state's lobbyist files, and attaches a
# report (probe/report.md) and sample pages to the run. Changes nothing in the repository, Dropbox or the site.
on:
  workflow_dispatch:
    inputs:
      bills:
        description: Bills of the 104th General Assembly to check, separated by spaces
        default: HB3769 HB2227 HB4714 HB166 HB1929 HB782 HB2017 HB4423 SB774 SB1113 SB625 SB2506 SB1072 SB1171 SB475 SB443 HB1795 HB3525 HB2347 SB2000

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check witness slips and lobbyist files
        working-directory: pipeline
        env:
          BILLS: ${{ inputs.bills }}
        run: |
          python probe_lobbying.py $BILLS
          mv probe ../probe
      - name: Attach the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lobbying-check
          path: probe/
