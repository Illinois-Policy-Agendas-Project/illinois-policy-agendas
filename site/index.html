<meta charset="utf-8">
<title>Illinois Policy Agendas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: masthead + tabs (home, three datasets, topics, sponsors, search). Light-only by design ("Lakefront"). */
:root{
  color-scheme:light;
  --bg:#ffffff; --band:#eef5fc; --sunk:#f4f7fb; --surface:#ffffff;
  --ink:#1b2330; --ink-2:#4b5566; --muted:#7b8494; --line:#e4e9f0; --line-2:#cfd7e2;
  --accent:#2c67ad; --btn:#dcebfb; --btn-ink:#1d4f8a; --sel:#e8f1fc; --mark:#fff1a8;
  --s-bills:#5b9fe3; --s-sots:#ef8f5d; --s-tt:#45b98f;
  --t-bills:#e5f0fb; --t-sots:#fdeee5; --t-tt:#e2f5ec;
  --h0:#f7fafd; --h1:#e3eefa; --h2:#c9def5; --h3:#a8c9ee; --h4:#86b3e6;
  --f-display:"Source Serif 4", Georgia, serif; --f-ui:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.86em} .muted{color:var(--muted)} .ink2{color:var(--ink-2)} .num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.2} h2{font-size:20px} h3{font-size:15px;font-family:var(--f-ui)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* masthead */
header.mast{background:var(--band);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:14px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--ink-2)}
nav.tabs{display:flex;gap:4px;width:100%;overflow-x:auto;margin-top:6px;scrollbar-width:none}
nav.tabs button{border:0;background:none;cursor:pointer;padding:10px 14px;font-size:14.5px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border-bottom:3px solid transparent}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line-2);margin:10px 6px}

main{padding-block:26px 64px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.phead p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{border-color:var(--btn-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.ds-bills{--c:var(--s-bills);--ct:var(--t-bills)} .ds-sots{--c:var(--s-sots);--ct:var(--t-sots)} .ds-tt{--c:var(--s-tt);--ct:var(--t-tt)}
.dsb{background:var(--ct);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--c)}
.code{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
input[type=search],input[type=number],select{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0;max-width:100%}
input[type=search]{padding:8px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:13.5px;z-index:20}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chead > *{min-width:0;max-width:100%}
.fbar select{flex:0 1 auto;min-width:0;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid-wide{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--sunk);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.kpi .l{font-size:12.5px;color:var(--ink-2)} .kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25} .kpi .s{font-size:12px;color:var(--muted)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:6px 12px}
.fbar input[type=search]{flex:1 1 220px}
.fbar .count{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;padding:4px 2px}
.check input{accent-color:var(--accent);margin:0}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1} .chart .base{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)} .legend span{display:inline-flex;align-items:center;gap:6px}
#tip{position:fixed;pointer-events:none;z-index:30;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 6px 18px rgba(30,40,60,.12);border-radius:6px;padding:8px 10px;font-size:12.5px;max-width:300px}
#tip .t{font-weight:600;margin-bottom:4px} #tip .r b{white-space:nowrap} #tip .r{display:flex;align-items:center;gap:10px;justify-content:space-between} #tip .seg-t{font-weight:600;margin:2px 0 4px;color:var(--ink)}
svg .seg:hover{stroke:var(--ink)!important;stroke-width:1.25px!important;fill-opacity:1!important}
#tip .r > span:first-child{display:flex;align-items:center;gap:6px}

/* heatmaps */
.hscroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
table.heat th{font-weight:500;color:var(--muted);font-size:11px;padding:2px;white-space:nowrap}
table.heat th.rh{text-align:left;font-size:12.5px;color:var(--ink-2);font-weight:500;padding-right:8px;max-width:210px;overflow:hidden;text-overflow:ellipsis}
table.heat td{text-align:center;border-radius:3px;font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer;padding:5px 2px;min-width:38px}
table.heat td.on{box-shadow:inset 0 0 0 2px var(--ink)}
table.heat tr.gov th{color:var(--ink-2);font-size:11px;text-align:left;border-bottom:2px solid var(--line-2)}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px;min-width:820px}
table.dt th{background:var(--sunk);text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tr.row{cursor:pointer} table.dt tr.row:hover td{background:var(--sunk)}
table.dt tr.open td{background:var(--sel)}
table.dt tr.det td{background:var(--sel);padding-top:0;color:var(--ink-2)}
.det-in{display:flex;flex-direction:column;gap:6px;max-width:90ch;padding-bottom:6px}

/* result cards */
.results{display:flex;flex-direction:column;gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.res .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.res .ttl{font-weight:600;font-size:15px}
.res .body{color:var(--ink-2);font-size:14px;max-width:85ch}
.res .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.ctx{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--t-sots);padding:2px 0 2px 14px;margin-block:4px;max-width:85ch}
.ctx p{margin:0}
.ctx-side{font-family:var(--f-display);font-size:14.5px;line-height:1.5;color:var(--muted)}
.ctx-edge{font-size:12px;color:var(--muted);font-style:italic}
.res .quote{font-family:var(--f-display);font-size:16px;color:var(--ink);font-weight:600;line-height:1.45;background:var(--t-sots);margin-left:-17px;padding:4px 8px 4px 14px;border-left:3px solid var(--s-sots);border-radius:0 4px 4px 0}

/* speech reader */
.strip{display:flex;height:26px;gap:1px;border-radius:4px;overflow:hidden;background:var(--line)}
.strip i{flex:1;background:var(--sunk);cursor:pointer}
.strip i.on{background:var(--s-sots)}
.strip i.np{background:var(--bg)}
.speech{font-family:var(--f-display);font-size:17px;line-height:1.75;max-width:75ch;color:var(--ink-2)}
.speech p{margin:0 0 14px}
.speech span{border-radius:3px;padding:1px 0;cursor:default}
.speech span.np{color:var(--muted)}
.speech span.on{background:var(--t-sots);color:var(--ink);box-shadow:0 0 0 2px var(--t-sots)}
.speech span.flash{outline:2px solid var(--s-sots)}
.speech sup{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);margin-left:2px}

/* topics */
.tp{display:grid;grid-template-columns:370px minmax(0,1fr);gap:24px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.tsubs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 18px;padding-left:8px;border-left:2px solid var(--line-2)}
.titem.tsub{grid-template-columns:40px minmax(0,1fr) 70px;padding:5px 8px}
.titem.tsub .nm{font-size:13px}
.titem.tsub.zero .nm{color:var(--muted)}
.titem[aria-expanded="true"]:not([aria-pressed="true"]) .nm{font-weight:600}
.titem{border:0;background:none;text-align:left;padding:7px 10px;border-radius:var(--r);cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 70px;gap:8px;align-items:center}
.titem:hover{background:var(--sunk)}
.titem[aria-pressed="true"]{background:var(--sel)}
.titem .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem[aria-pressed="true"] .nm{font-weight:600}
.mini{display:flex;flex-direction:column;gap:2px}
.mini i{height:4px;border-radius:2px;background:var(--c);display:block;min-width:1px}
.subtab{width:100%;border-collapse:collapse;font-size:13.5px}
.subtab th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.subtab th:nth-child(-n+2){text-align:left}
.subtab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.subtab td:nth-child(-n+2){text-align:left}
.subtab tr{cursor:pointer} .subtab tbody tr:hover td{background:var(--sunk)} .subtab tr.on td{background:var(--sel);font-weight:600}
.subtab td.z{color:var(--line-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:600}

/* search */
.bigsearch{display:flex;gap:8px}
.bigsearch input{flex:1;font-size:18px;padding:12px 16px;border-radius:var(--r)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.sugg button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.sugg button:hover{background:var(--sel)}

/* record pages */
a.rl{color:var(--ink);text-decoration:none} a.rl:hover{color:var(--accent);text-decoration:underline}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:6px;color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px;text-align:left}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs a{color:var(--ink-2)}
.rec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.rec-head .eyebrow{display:flex;align-items:center;gap:6px}
.rec-head h1{font-size:32px;margin-top:4px;overflow-wrap:anywhere} .rec-head h1.mono-h{font-family:var(--f-mono);font-weight:500;letter-spacing:-.02em}
.rec-sub{font-size:17px;color:var(--ink-2);margin-top:2px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rec-actions{display:flex;gap:8px;flex-wrap:wrap}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.rec-main,.rec-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.rec-grid.sticky .rec-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}
.sec-t{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--f-ui)}
.sec-b{display:flex;flex-direction:column;gap:10px;min-width:0}
.prose{font-size:15.5px;line-height:1.65;max-width:75ch}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:13.5px}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0;overflow-wrap:anywhere}
.coding{display:flex;flex-direction:column;gap:8px;font-size:14px}
ol.steps{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
ol.steps li{position:relative;padding:5px 0 5px 22px;font-size:14px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
ol.steps li::before{content:"";position:absolute;left:4px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
ol.steps li::after{content:"";position:absolute;left:7px;top:19px;bottom:-12px;width:1px;background:var(--line-2)}
ol.steps li:last-child::after{display:none}
ol.steps li.mile{color:var(--ink);font-weight:600} ol.steps li.mile::before{background:var(--s-bills);width:9px;height:9px;left:3px;top:11px}
.chip.vote{font-weight:500;font-family:var(--f-mono);font-size:11px}
.rels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.rel{display:flex;flex-direction:column;gap:6px;min-width:0}
.rel-h{display:flex;gap:7px;align-items:center;font-size:13.5px} .rel-h b{font-weight:600}
.rel-i{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:6px;background:var(--sunk);text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.4;border-left:3px solid var(--c)}
.rel-i:hover{background:var(--sel)} .rel-i .muted{font-size:12px} .rel-i .q{font-family:var(--f-display)}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.quote-s{font-family:var(--f-display);font-size:15.5px;line-height:1.5;font-weight:600;border-left:3px solid var(--s-sots);padding-left:10px}
.yrchips{display:flex;flex-wrap:wrap;gap:5px} .yrchips a{text-decoration:none}
.speech span{cursor:pointer} .speech span:hover{background:var(--sunk)}
.speech span.sel{outline:2px solid var(--s-sots);outline-offset:1px;background:var(--t-sots);color:var(--ink)}
a.spn{color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px} a.spn:hover{color:var(--accent);text-decoration-color:currentColor}
.splist{font-size:13.5px;line-height:1.6}
.pr{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.subrow{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:var(--sunk);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13.5px}
.subrow:hover{background:var(--sel)}
.seg button[disabled]{color:var(--muted);cursor:not-allowed}
.upd{color:var(--muted);white-space:nowrap} .upd:not(:empty)::before{content:"· "}
.loadbar{padding:10px 14px;margin-bottom:12px;border-radius:var(--r);background:var(--sel);color:var(--btn-ink);font-size:13.5px}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;min-width:620px}
table.cmp th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.cmp td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.cmp td:first-child{white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.cmp tbody tr{cursor:pointer} table.cmp tbody tr:hover td{background:var(--sunk)} table.cmp tr.on td{background:var(--sel)}
.cbar{display:flex;align-items:center;gap:6px;min-width:110px} .cbar i{display:block;height:9px;border-radius:0 3px 3px 0;background:var(--c);min-width:1px}
.cbar i.muted-b{background:var(--line-2)} .cbar span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rec-title{display:flex;gap:16px;align-items:center;min-width:0}
.org-logo{display:inline-grid;place-items:center;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.org-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.org-logo.lg{width:84px;height:84px;padding:8px}
.org-logo.xs{width:22px;height:22px;padding:2px;border-radius:5px}
.org-logo.mono{background:var(--t-tt);border-color:transparent;color:var(--ink);font-weight:700;letter-spacing:.02em;font-family:var(--f-ui)}
.org-logo.mono.lg{font-size:24px} .org-logo.mono.xs{font-size:8.5px;letter-spacing:0}
.rh-org{display:inline-flex;align-items:center;gap:7px}
/* organization rows in the topic table: names wrap inside their own column instead of running into the cells */
table.heat th.rh:has(.rh-org){max-width:none;min-width:250px;width:250px;white-space:normal;overflow:visible}
table.heat .rh-org{display:flex;line-height:1.25} table.heat .rh-org .org-logo{width:48px;flex:none} table.heat .rh-org .muted{white-space:nowrap}
@media (max-width:560px){ .org-logo.lg{width:60px;height:60px;padding:6px} .org-logo.mono.lg{font-size:18px} }
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}

<script>
"use strict";
const DS = {
  bills:{name:'Substantive bills', short:'Bills', cls:'ds-bills'},
  sots:{name:'State of the State speeches', short:'Speeches', cls:'ds-sots'},
  tt:{name:'Think tank reports', short:'Think tanks', cls:'ds-tt'}
};
const DSK = ['bills','sots','tt'], NOPOL = -555;
const TABS = [['home','Home'],null,['bills','Bills','ds-bills'],['speeches','Speeches','ds-sots'],['thinktanks','Think tanks','ds-tt'],null,['topics','Topics'],['sponsors','Sponsors'],['search','Search']];
const BILLTYPE = {HB:'House bill',SB:'Senate bill',HR:'House resolution',SR:'Senate resolution',HJR:'House joint resolution',SJR:'Senate joint resolution',HJRCA:'House joint res. (const. amendment)',SJRCA:'Senate joint res. (const. amendment)',AM:'Appointment message',EO:'Executive order',JSR:'Joint session resolution'};
const FLAGS = {L:'Became law / adopted',C:'Commemorative',A:'Appropriation',N:'Nomination',R:'Roll-call vote'};
let GOV = {}, USED_MAJORS = new Set();   // year -> {governor, party}; major topics that have records
const partyAbbr = p => p ? p[0].toUpperCase() : '';
const govLabel = (name, year) => { const g = GOV[year]; const n = name || g?.governor || ''; return g && g.governor===n && g.party ? `${n} (${partyAbbr(g.party)})` : n; };
/* consecutive years under one governor, for shading trend charts */
function govBands(x0, x1){ const out = []; for (let y=x0; y<=x1; y++){ const g = GOV[y]; if (!g) continue; const l = out[out.length-1];
  if (l && l.governor===g.governor && l.to===y-1) l.to = y; else out.push({governor:g.governor, party:g.party, from:y, to:y}); } return out; }
let CB, R = [], RAW = {}, BILLKEY = new Map();
/* every record's own page */
const href = r => r.ds==='bills' ? `#bill-${r.x.ga}-${r.x.bill.replace(' ','')}` : r.ds==='tt' ? '#report-'+r.id : `#speech-${r.year}-s${r.id}`;
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const majorOf = s => s == null ? null : s === NOPOL ? NOPOL : Math.floor(s/100);
const majorName = m => m == null ? 'Not yet coded' : m === NOPOL ? 'No policy content' : (CB.majors[m] || 'Major ' + m);
const subName = s => s == null ? 'Not yet coded' : s === NOPOL ? 'No policy content' : (CB.subs[s] || 'Subtopic ' + s);
const MAJORS = () => Object.keys(CB.majors).map(Number).filter(m=>!USED_MAJORS.size || USED_MAJORS.has(m)).sort((a,b)=>a-b);
const subsOf = m => Object.keys(CB.subs).map(Number).filter(s=>Math.floor(s/100)===m).sort((a,b)=>a-b);
const isPol = r => r.sub != null && r.sub !== NOPOL;
const ilga = x => /^https?:/.test(x.link||'') ? x.link : `https://ilga.gov/ftp/legislation/${x.ga}/BillStatus/HTML/${x.link}.html`;
const spNames = r => (r.sp||[]).map(([i])=>SPON[i]?.title).filter(Boolean);
const sponsorText = r => spNames(r).join(', ');
const pl = (n, one, many) => `${fmt(n)} ${n===1 ? one : (many || one+'s')}`;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function count(a, f){ const m = new Map(); for (const r of a){ const k=f(r); m.set(k,(m.get(k)||0)+1); } return m; }
const range = (a,b) => Array.from({length:b-a+1}, (_,i)=>a+i);
function parseQuery(q){ const t=[]; q.toLowerCase().replace(/"([^"]+)"|(\S+)/g,(_,a,b)=>{ const x=(a||b).trim(); if (x) t.push(x); }); return t; }
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hl(text, terms, max){ let t = String(text ?? ''); if (max && t.length > max) t = t.slice(0,max).replace(/\s\S*$/,'') + '…'; const h = esc(t);
  return terms.length ? h.replace(new RegExp('(' + terms.map(x=>reEsc(esc(x))).join('|') + ')','gi'), '<mark>$1</mark>') : h; }

const subChip = s => s == null ? `<span class="code">—</span> <span class="muted">Not yet coded</span>` : `<span class="code">${s===NOPOL?'−555':s}</span> ${esc(subName(s))}`;

const subOptions = (m, sel) => m==null ? '' : `<option value="">All subtopics in ${m}</option>` + subsOf(m).map(s=>`<option value="${s}" ${sel===s?'selected':''}>${s} · ${esc(CB.subs[s])}</option>`).join('');

/* ---------- data ----------
   data/manifest.json lists the sessions and a version hash per file (so browsers never show stale data).
   Bills load as a small summary for every session; each session's synopses, sponsors and histories
   load only when a view needs them (see need() below). */

const LOADED = {details:new Set(), links:new Set()};
const vkey = f => ({'bills/summary':'bills', thinktanks:'tt'})[f] || f.replace(/^bills\/(\d+)\/(\w+)$/,'$2-$1');
const get = f => fetch('data/'+f+'.json?v='+(MAN?.v?.[vkey(f)] || '')).then(r=>{ if (!r.ok) throw new Error(f); return r.json(); });
const gaName = ga => `${ga}th General Assembly`;
const gaYears = ga => ALL_SESSIONS.find(s=>s.ga===ga)?.years || '';
const isUpcoming = ga => !!ALL_SESSIONS.find(s=>s.ga===ga && s.upcoming);
async function load(){
  MAN = await fetch('data/manifest.json?t='+Date.now()).then(r=>{ if (!r.ok) throw new Error('manifest'); return r.json(); });
  /* SESSIONS: sessions with bills. ALL_SESSIONS also has placeholders for sessions that haven't started (shown only in the Bills session menu). */
  ALL_SESSIONS = MAN.sessions.slice().sort((a,b)=>a.ga-b.ga); SESSIONS = ALL_SESSIONS.filter(s=>!s.upcoming); LATEST = SESSIONS[SESSIONS.length-1]?.ga;
  const [cb,b,s,t,pp,op,gv,hm] = await Promise.all(['codebook','bills/summary','sots','thinktanks','people', MAN.v?.orgs ? 'orgs' : null, MAN.v?.governors ? 'governors' : null, MAN.v?.home ? 'home' : null].map(f=>f ? get(f) : null));
  HOME = hm; ORGPROF = op || {}; GOV = Object.fromEntries((gv||[]).map(g=>[g.year, g]));
  CB = cb; RAW = {bills:b, sots:s, tt:t};
  const obj = d => d.rows.map(r => Object.fromEntries(d.cols.map((c,i)=>[c,r[i]])));
  const start = Object.fromEntries(SESSIONS.map(s=>[s.ga, parseInt(s.years) || null]));
  obj(b).forEach((x,i)=>{ x.synopsis=''; R.push({ds:'bills', id:i, key:x.key, year:Math.max(start[x.ga]||0, +(x.intro||'0').slice(0,4)), date:x.intro||'', sub:x.sub, title:x.bill+' · '+x.short, text:'', x, sp:[]}); });
  for (const x of obj(s)) R.push({ds:'sots', id:x.id, year:x.year, date:null, sub:x.sub, title:x.governor+', '+x.year, text:x.text, x});
  for (const x of obj(t)) R.push({ds:'tt', id:x.id, year:x.year, date:x.date, sub:x.sub, title:x.title, text:x.abstract, x});
  for (const r of R) BYDS[r.ds].push(r);
  const sp = BYDS.sots.slice().sort((a,b)=>a.id-b.id);
  sp.forEach((r,i)=>{ const p=sp[i-1], n=sp[i+1]; r.prev = p && p.year===r.year ? p : null; r.next = n && n.year===r.year ? n : null; });
  BILLKEY = new Map(BYDS.bills.map(r=>[r.key, r]));
  buildSponsors(pp.people);
  for (const r of R){ r.major = majorOf(r.sub); setHay(r); if (r.major!=null && r.major!==NOPOL) USED_MAJORS.add(r.major); }
  const u = $('#updated'); const c = MAN.changes?.bills || {}, bits = [c.new && `${fmt(c.new)} new bills`, c.newly_coded && `${fmt(c.newly_coded)} newly coded`, c.recoded && `${fmt(c.recoded)} recoded`].filter(Boolean);
  if (u) u.textContent = `Data updated ${new Date(MAN.updated.replace(' ','T')).toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'})}${bits.length?' ('+bits.join(', ')+')':''}`;
  await need({details:[LATEST], links:[LATEST]});
}
function setHay(r){ r.hay = (r.title+' '+r.text+' '+(r.ds==='bills' ? r.sp.map(([i])=>SPON[i].name).join(' ')+' '+r.x.bill.replace(' ','') : r.ds==='tt' ? r.x.org : r.x.governor)).toLowerCase(); }
/* fetch whatever per-session files a view needs; resolves at once if they are already here */
async function need({details=[], links=[]}){
  const live = new Set(SESSIONS.map(s=>s.ga));

      ${p.photo ? `<img class="avatar" src="data/${esc(p.photo)}" alt="">` : `<span class="avatar mono" aria-hidden="true">${esc(initials(p.name||''))}</span>`}
      <div style="min-width:0"><div class="pname">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>`:esc(p.name)}</div>
      <div class="ptitle">${esc(p.title||p.role||'')}</div>${p.bio?`<p class="pbio">${esc(p.bio)}</p>`:''}</div></div>`).join('')}</div></div>
  </section>
  ${(H.sponsors||[]).length ? `<section class="home-sponsors">${H.sponsors.map(sp=>`<div class="sponsor"><span class="eyebrow">${esc(sp.role||'')}</span>
      <a href="${esc(sp.url||'#')}" target="_blank" rel="noopener" class="sp-mark">${sp.logo ? `<img src="data/${esc(sp.logo)}" alt="${esc(sp.name)}">` : `<span class="sp-name">${esc(sp.name)}</span>`}</a></div>`).join('')}</section>` : ''}`;
}

/* =================== BILLS ===================
   Three views of the same session: everything introduced (#bills), measures that got out of committee
   (#bills-committee) and bills that became law (#bills-law). Stages come from the build (pipeline/build.py bill_stage):
   1 introduced, 2 out of committee, 3 passed one chamber, 4 passed both chambers, 5 became law (Public Act). */
const BL = { ga:null, view:'intro', q:'', type:'', major:null, sub:null, status:'', cmte:'', page:0 };
const BVIEWS = { intro:{token:'bills', label:'Introduced'}, committee:{token:'bills-committee', label:'Advanced from committee'}, law:{token:'bills-law', label:'Became law'}, activity:{token:'bills-activity', label:'Latest actions'} };
const STAGES = ['Introduced', 'Out of committee', 'Passed one chamber', 'Passed both chambers', 'Became law'];
const billsOf = ga => byDs('bills').filter(r=>r.x.ga===ga);
const isBillT = r => r.x.type==='HB' || r.x.type==='SB';
const inView = r => BL.view==='intro' ? true : BL.view==='committee' ? r.x.stage>=2 : r.x.stage>=5;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
function billFilter(skipTopic){ const t=parseQuery(BL.q);
  return billsOf(BL.ga).filter(r=>{ const x=r.x; return inView(r)
    && (!BL.type || x.type===BL.type)
    && (skipTopic || BL.major==null || r.major===BL.major) && (skipTopic || BL.sub==null || r.sub===BL.sub)
    && (!BL.status || x.flags.includes(BL.status))
    && (BL.view!=='committee' || !BL.cmte || x.cmte===BL.cmte)
    && t.every(w=>r.hay.includes(w)); }); }
function renderBills(){
  BL.ga ??= LATEST; const all = billsOf(BL.ga), B = all.filter(isBillT); const y0 = parseInt(gaYears(BL.ga)) || 2025, preStart = `${y0-1}-12`;
  const V = BL.view, inTopic = r => (BL.major==null || r.major===BL.major) && (BL.sub==null || r.sub===BL.sub);
  const funnel = STAGES.map((_,i)=>B.filter(r=>inTopic(r) && r.x.stage>=i+1).length);
  const out = all.filter(r=>r.x.stage>=2), laws = B.filter(r=>r.x.stage>=5);
  const lawDays = laws.filter(r=>r.x.law_date && r.x.intro).map(r=>daysBetween(r.x.intro, r.x.law_date)).sort((a,b)=>a-b);
  const median = a => a.length ? a[Math.floor(a.length/2)] : null;
  const topCmte = [...count(out.filter(r=>r.x.cmte), r=>r.x.cmte)].sort((a,b)=>b[1]-a[1])[0];
  const chiefs = new Set(all.map(r=>chiefOf(r)?.i).filter(x=>x!=null));
  const kpis = {
    intro: [['Substantive bills introduced', fmt(all.length), `${fmt(all.filter(r=>r.x.type==='HB').length)} House, ${fmt(all.filter(r=>r.x.type==='SB').length)} Senate`],
            ['Became law', fmt(laws.length), `${pct(laws.length/Math.max(1,B.length))} of bills introduced`],
            ['Policy-coded', fmt(all.filter(isPol).length), `${fmt(all.filter(r=>r.sub==null).length)} not yet coded`],
            ['Primary sponsors', fmt(chiefs.size), 'legislators who introduced at least one bill']],
    committee: [['Bills out of committee', fmt(out.length), `${pct(out.length/Math.max(1,B.length))} of bills introduced`],
            ['Went on to pass a chamber', fmt(B.filter(r=>r.x.stage>=3).length), `${pct(B.filter(r=>r.x.stage>=3).length/Math.max(1,out.length))} of bills out of committee`],
            ['Became law', fmt(laws.length), `${pct(laws.length/Math.max(1,out.length))} of bills out of committee`],
            ['Busiest committee', topCmte ? esc(topCmte[0].replace(/ Committee$/,'')) : '—', topCmte ? `${fmt(topCmte[1])} bills advanced` : '']],
    law: [['Bills that became law', fmt(laws.length), `${pct(laws.length/Math.max(1,B.length))} of ${fmt(B.length)} bills introduced`],
            ['Median time to law', median(lawDays)!=null ? `${fmt(median(lawDays))} days` : '—', 'from introduction to Public Act'],
            ['Passed both chambers', fmt(B.filter(r=>r.x.stage>=4).length), `${fmt(B.filter(r=>r.x.stage===4).length)} not (yet) law`],
            ['Drew a veto', fmt(B.filter(r=>r.x.veto).length), 'total, amendatory or item veto']]
  }[V];
  const big = v => String(v).length > 14 ? 'font-size:17px;padding-block:5px' : '';
  const header = `
  <div class="phead"><div><div class="eyebrow">Dataset · ${gaName(BL.ga)}, ${esc(gaYears(BL.ga))}</div><h1>Substantive bills</h1>
    <p>Every House and Senate bill introduced in the ${gaName(BL.ga)}: what was introduced, what got out of committee, and what became law. Resolutions, appointments and commemorative measures are left out. Each bill has its ILGA synopsis, sponsors, history and policy subtopic.</p>
    ${ALL_SESSIONS.length>1?`<div class="fbar" style="margin:10px 0 0"><label class="ink2" for="b-ga" style="font-size:13.5px">Session</label><select id="b-ga">${ALL_SESSIONS.slice().reverse().map(s=>`<option value="${s.ga}" ${s.ga===BL.ga?'selected':''}>${gaName(s.ga)} (${esc(s.years)})${s.upcoming?' · not started':''}</option>`).join('')}</select></div>`:''}</div>
    <button class="btn primary" id="b-all">Download all ${fmt(all.length)} bills (CSV)</button></div>
  <nav class="vtabs" aria-label="Bill stage">${Object.entries(BVIEWS).map(([k,v])=>{ const n = k==='intro' ? all.length : k==='committee' ? out.length : laws.length;
    return `<a href="#${v.token}" class="vtab" aria-current="${k===V?'page':'false'}">${v.label}${k==='activity'?'':`<span class="num">${fmt(n)}</span>`}</a>`; }).join('')}</nav>
`;
  if (isUpcoming(BL.ga)){ const sx = ALL_SESSIONS.find(x=>x.ga===BL.ga);
    $('#view').innerHTML = header.replace(/<nav class="vtabs"[\s\S]*<\/nav>/, '').replace(/<button class="btn primary" id="b-all">[\s\S]*?<\/button>/, '') + `<div class="panel upcoming"><div class="eyebrow">Not started</div><h2>The ${gaName(BL.ga)} ${sx.starts?`convenes in ${esc(sx.starts)}`:'has not convened yet'}</h2>
      <p class="ink2" style="margin:0;max-width:62ch">Its bills will appear here, with their topics, sponsors and legislative histories, once the session begins and the first bills are collected and coded. Until then, the ${gaName(LATEST)} (${esc(gaYears(LATEST))}) is the most recent session.</p>
      <div><button class="btn primary" id="b-back">Show the ${gaName(LATEST)}</button></div></div>`;
    $('#b-back').addEventListener('click', ()=>{ BL.ga = LATEST; renderBills(); });

    return; }
  if (V==='activity') return renderActivity(all, header);
  $('#view').innerHTML = header + `
  <div class="funnel" aria-label="Substantive bills by furthest stage reached">${STAGES.map((s,i)=>{ const link = i===0?'bills':i===1?'bills-committee':i===4?'bills-law':null, on = (i===0&&V==='intro')||(i===1&&V==='committee')||(i===4&&V==='law');
    const inner = `<span class="fs">${s}</span><span class="fn num">${fmt(funnel[i])}</span><span class="fp">${i?pct(funnel[i]/Math.max(1,funnel[0]),1)+' of bills':'substantive bills'}</span><i class="fbar-in" style="width:${(funnel[i]/Math.max(1,funnel[0])*100).toFixed(1)}%"></i>`;
    return link ? `<a class="fstep ${on?'on':''}" href="#${link}">${inner}</a>` : `<div class="fstep">${inner}</div>`; }).join('<span class="farrow" aria-hidden="true">›</span>')}</div>
  <p class="muted" style="font-size:12px;margin:-6px 0 14px">${BL.major!=null?`Bills on ${esc(BL.sub!=null?CB.subs[BL.sub]:CB.majors[BL.major])} only. `:''}Furthest stage each bill reached, read from its ILGA action history. "Out of committee" includes bills sent straight to the floor by Senate Assignments.</p>
  <div class="kpis">${kpis.map(([l,v,s])=>`<div class="kpi"><span class="l">${l}</span><span class="v" style="${big(v)}">${v}</span><span class="s">${s}</span></div>`).join('')}</div>
  <div class="grid-wide" id="b-charts"></div>
  <div class="fbar">
    <input type="search" id="b-q" placeholder="Search bill text, number or sponsor" value="${esc(BL.q)}" aria-label="Search bills">
    <select id="b-type" aria-label="Chamber"><option value="">House and Senate bills</option><option value="HB">House bills (HB)</option><option value="SB">Senate bills (SB)</option></select>
    <select id="b-major" aria-label="Topic">${majorOptions(BL.major)}</select>
    ${BL.major!=null?`<select id="b-sub" aria-label="Subtopic">${subOptions(BL.major, BL.sub)}</select>`:''}
    ${V==='committee'?`<select id="b-cmte" aria-label="Committee"><option value="">All committees</option>${[...count(out.filter(r=>r.x.cmte), r=>r.x.cmte)].sort((a,b)=>a[0].localeCompare(b[0])).map(([c,n])=>`<option value="${esc(c)}" ${BL.cmte===c?'selected':''}>${esc(c)} (${fmt(n)})</option>`).join('')}</select>`:''}
    <select id="b-status" aria-label="Other filters"><option value="">Any bill</option><option value="R">Had a roll-call vote</option><option value="A">Appropriations bills</option></select>
  </div>
  <div class="fbar"><div class="count" style="margin-left:0"><span id="b-n"></span><button class="btn primary" id="b-dl">Download these rows</button></div></div>
  <div class="tscroll"><table class="dt"><thead><tr>${{intro:['Bill','Introduced','Description','Topic','Latest action'], committee:['Bill','Introduced','Description','Topic','Committee','Furthest stage'], law:['Public Act','Bill','Description','Topic','Became law','Days']}[V].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="b-tb"></tbody></table></div>
  <div class="pager" id="b-pg"></div>`;
  if ($('#b-type')) $('#b-type').value = BL.type; if ($('#b-status')) $('#b-status').value = BL.status;
  const charts = $('#b-charts');
  if (V==='intro'){
    charts.innerHTML = `<div class="panel"><div class="chead"><h3>Bills by major topic</h3><span class="muted" style="font-size:12px">Click a bar to filter the table</span></div><div id="b-top"></div></div>
      <div class="panel"><div class="chead"><h3>Introductions by month</h3><div class="legend"><span class="ds-bills"><i class="dot" style="border-radius:2px"></i>House bills</span><span><i class="dot" style="background:var(--h3);border-radius:2px"></i>Senate bills</span></div></div><div id="b-mo"></div>
      <div class="muted" style="font-size:12px">From December ${y0-1}, when prefiling opened.${all.filter(r=>r.date<preStart).length?` ${pl(all.filter(r=>r.date<preStart).length,'bill')} dated earlier ${all.filter(r=>r.date<preStart).length===1?'is':'are'} not shown.`:''}</div><h3 style="margin-top:8px">Most active primary sponsors</h3><div id="b-ty"></div></div>`;
    const months = [...new Set(all.map(r=>r.date.slice(0,7)))].filter(k=>k>=preStart).sort();
    const mb = count(B.filter(r=>r.x.type==='HB'), r=>r.date.slice(0,7)), mo = count(B.filter(r=>r.x.type==='SB'), r=>r.date.slice(0,7));
    const mname = k => new Date(k+'-15').toLocaleString('en-US',{month:'short', year:'numeric'});
    columns($('#b-mo'), months.map(k=>new Date(k+'-15').toLocaleString('en-US',{month:'short'}) + (k.endsWith('-01')||k===months[0]?" '"+k.slice(2,4):'')),
      [{label:'House bills', cls:'ds-bills', color:'--s-bills', values:months.map(k=>mb.get(k)||0)},{label:'Senate bills', cls:'', color:'--h3', values:months.map(k=>mo.get(k)||0)}], {height:170});
    $$('#b-mo .hit').forEach((h,i)=>{ h.addEventListener('pointermove', e=>showTip(e, `<div class="t">${mname(months[i])}</div>${tipRow('ds-bills','House bills',fmt(mb.get(months[i])||0))}<div class="r"><span><i class="dot" style="background:var(--h3)"></i>Senate bills</span><b class="num">${fmt(mo.get(months[i])||0)}</b></div>`)); });
    const tc = [...count(all.filter(r=>chiefOf(r)), r=>chiefOf(r).i)].sort((a,b)=>b[1]-a[1]).slice(0,6);
    hbars($('#b-ty'), tc.map(([i,v])=>({label:SPON[i].title, value:v, color:'--h3', tip:`<div class="r"><span>Bills as primary sponsor</span><b class="num">${fmt(v)}</b></div><div class="muted">Click for their page</div>`, onclick:()=>nav('sponsor-'+SPON[i].slug)})), {labelW:200, rowH:22});
  } else if (V==='committee'){
    charts.innerHTML = `<div class="panel"><div class="chead"><h3>Share of bills that got out of committee, by topic</h3><span class="muted" style="font-size:12px">Click to filter</span></div><div id="b-top"></div></div>
      <div class="panel"><div class="chead"><h3>Committees that advanced the most bills</h3><span class="muted" style="font-size:12px">Click to filter</span></div><div id="b-cm"></div>
      <div class="muted" style="font-size:12px">The first committee to approve each bill. House shell bills often move through the Executive Committee.</div></div>`;
    const cc = [...count(billsOf(BL.ga).filter(r=>r.x.stage>=2 && r.x.cmte && inTopic(r)), r=>r.x.cmte)].sort((a,b)=>b[1]-a[1]).slice(0,12);
    hbars($('#b-cm'), cc.map(([c,n])=>({label:c.replace(/ Committee$/,''), value:n, color:'--s-bills', on:BL.cmte===c, onclick:()=>{ BL.cmte = BL.cmte===c?'':c; BL.page=0; renderBills(); }})), {labelW:260, rowH:22});
  } else {
    charts.innerHTML = `<div class="panel"><div class="chead"><h3>Laws by major topic</h3><span class="muted" style="font-size:12px">Click a subtopic in a bar to list its laws</span></div><div id="b-top"></div></div>
      <div class="panel"><div class="chead"><h3>${BL.sub!=null ? `Laws on ${esc(CB.subs[BL.sub])}` : BL.major!=null ? `Laws on ${esc(CB.majors[BL.major])}` : 'Laws by subtopic'}</h3>${BL.major!=null?`<span class="muted num" style="font-size:12px">${fmt(laws.filter(inTopic).length)} laws</span>`:''}</div><div id="b-ll" class="lawlist"></div></div>`;
    const ll = BL.major==null ? [] : laws.filter(inTopic).sort((a,b)=>(b.x.law_date||'').localeCompare(a.x.law_date||''));
    $('#b-ll').innerHTML = BL.major==null ? '<p class="muted" style="margin:0;font-size:13.5px">Click a subtopic in a bar of the chart (or a topic name, or pick one from the menus above) to list its laws and their primary sponsors here.</p>'
      : ll.length ? `<ol>${ll.map(r=>{ const c=chiefOf(r); return `<li><a class="rl" href="${href(r)}">${esc(r.x.short)}</a><div class="muted"><span class="mono">${esc(r.x.bill)}</span>${r.x.pa?` · P.A. ${esc(r.x.pa)}`:''}${c?` · ${spLink(c)}`:''}</div></li>`; }).join('')}</ol>`
      : '<p class="muted" style="margin:0">No laws on this topic yet.</p>';
  }
  const go2 = ()=>{ BL.page=0; billsUpdate(); };
  let deb; $('#b-q').addEventListener('input', e=>{ clearTimeout(deb); deb=setTimeout(()=>{ BL.q=e.target.value; go2(); },160); });

  $('#b-major').addEventListener('change', e=>{ BL.major=e.target.value===''?null:+e.target.value; BL.sub=null; BL.page=0; renderBills(); });

  $('#b-all').addEventListener('click', ()=>save(`illinois-bills-${BL.ga}th-ga.csv`, csvFor(all)));

/* ---- Latest actions: each bill's most recent action, newest first ----
   Only the latest step of a bill's ILGA history carries a date in the data, so each bill appears once. */
const ACT_KINDS = [
  ['law', 'Became law', /^Public Act|Governor Approved|Effective Date/i],
  ['veto', 'Veto', /Veto/i],
  ['routine', 'Deadline re-referral', /Re-referred|Deadline (Established|Extended)|Pursuant to Senate Rule|Sine Die/i],
  ['sponsor', 'Sponsor change', /Co-Sponsor|Sponsor Changed|Sponsor Removed|Chief (House|Senate) Sponsor|Alternate|Removed (Chief )?Co-Sponsor/i],
  ['governor', 'Sent to governor', /Sent to the Governor|Passed Both Houses/i],
  ['passed', 'Passed a chamber', /Third Reading.*Passed|Arrive(d)? in|Received by/i],
  ['floor', 'Floor action', /Second Reading|Third Reading|Placed on Calendar|Recalled|Floor Amendment|Held on Calendar|Motion/i],
  ['committee', 'Committee action', /Do Pass|Assigned to|Committee|^To |Postponed|Recommends|Approved for Consideration|Subcommittee/i],
  ['intro', 'Introduced', /Filed with|First Reading|Prefiled|^Referred to (Rules Committee|Assignments)$/i],
];
const actKind = t => (ACT_KINDS.find(([,,re])=>re.test(t||'')) || ['other','Other action'])[0];
const ACT_LABEL = Object.fromEntries([...ACT_KINDS.map(([k,l])=>[k,l]), ['other','Other action']]);
const ACT_VERB = {law:'became law', governor:'went to the governor', passed:'passed a chamber', floor:'moved on the floor', committee:'saw committee action', intro:'were introduced'};
const ACT = { kind:'', routine:false, q:'', major:null, type:'', shown:120 };
function renderActivity(all, header){
  for (const r of all) r.x.kind ??= actKind(r.x.last_action);
  const latest = all.reduce((m,r)=>r.x.last_date>m?r.x.last_date:m, '');
  const week = new Date(new Date(latest) - 6*864e5).toISOString().slice(0,10);
  const recent = all.filter(r=>r.x.last_date>=week), rc = count(recent, r=>r.x.kind);
  $('#view').innerHTML = header + `
  <div class="panel act-sum"><div><div class="eyebrow">Last 7 days in the data · ${new Date(week).toLocaleDateString('en-US',{month:'short', day:'numeric'})} to ${new Date(latest).toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'})}</div>
      <p style="margin:4px 0 0"><b class="num">${fmt(recent.length)}</b> bills had their latest action: ${['law','governor','passed','floor','committee','intro'].filter(k=>rc.get(k)).map(k=>`<b class="num">${fmt(rc.get(k))}</b> ${ACT_VERB[k]}`).join(', ')}${rc.get('routine')?`, and <b class="num">${fmt(rc.get('routine'))}</b> were sent back to committee at a deadline`:''}.</p></div>
    <p class="muted" style="margin:0;font-size:12.5px;max-width:60ch">Only the most recent step of each bill's history is dated in the data, so each bill appears once, at its latest action. The feed is as current as the last data update.</p></div>
  <div class="fbar">
    <input type="search" id="a-q" placeholder="Search bill text, number, sponsor or action" value="${esc(ACT.q)}" aria-label="Search actions">
    <select id="a-type" aria-label="Chamber"><option value="">House and Senate bills</option><option value="HB">House bills</option><option value="SB">Senate bills</option></select>
    <select id="a-m" aria-label="Topic">${majorOptions(ACT.major)}</select>
    <label class="check"><input type="checkbox" id="a-r" ${ACT.routine?'checked':''}>Show routine actions (deadline re-referrals, sponsor changes)</label>
  </div>
  <div class="kchips" role="group" aria-label="Kind of action"></div>
  <div id="a-feed" class="feed"></div>
  <div class="pager"><button class="btn" id="a-more" hidden>Show more</button></div>`;
  $('#a-type').value = ACT.type;
  const draw = () => {
    const t = parseQuery(ACT.q);
    const base = all.filter(r=>(!ACT.type || r.x.type===ACT.type) && (ACT.major==null || r.major===ACT.major) && t.every(w=>r.hay.includes(w) || r.x.last_action.toLowerCase().includes(w)));
    const vis = base.filter(r=>ACT.routine || !['routine','sponsor'].includes(r.x.kind));
    const kc = count(vis, r=>r.x.kind);
    $('.kchips').innerHTML = [['', 'All', vis.length], ...[...ACT_KINDS.map(([k])=>k), 'other'].filter(k=>kc.get(k)).map(k=>[k, ACT_LABEL[k], kc.get(k)])]
      .map(([k,l,n])=>`<button class="kchip k-${k||'all'}" data-k="${k}" aria-pressed="${ACT.kind===k}">${l} <span class="num">${fmt(n)}</span></button>`).join('');
    $$('.kchips button').forEach(b=>b.addEventListener('click', ()=>{ ACT.kind=b.dataset.k; ACT.shown=120; draw(); }));
    const rows = vis.filter(r=>!ACT.kind || r.x.kind===ACT.kind).sort((a,b)=>b.x.last_date.localeCompare(a.x.last_date) || (KORD[a.x.kind]-KORD[b.x.kind]) || a.id-b.id);
    const shown = rows.slice(0, ACT.shown); let html = '', day = '';
    for (const r of shown){ const x = r.x;
      if (x.last_date !== day){ day = x.last_date; const n = rows.filter(q=>q.x.last_date===day).length;
        html += `<h3 class="fday">${new Date(day+'T12:00').toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'})} <span class="muted num">${pl(n,'bill')}</span></h3>`; }
      html += `<div class="fitem"><span class="kchip k-${x.kind} static">${ACT_LABEL[x.kind]}</span>
        <div style="min-width:0"><div class="ftop"><a class="mono" href="${href(r)}">${esc(x.bill)}</a> <a class="rl" href="${href(r)}">${hl(x.short,t)}</a></div>
        <div class="fact">${hl(x.last_action,t)}</div>

  const m = TP.major, inM = Object.fromEntries(DSK.map(k=>[k, base[k].filter(r=>r.major===m)]));
  if (TP.sub!=null && Math.floor(TP.sub/100)!==m) TP.sub = null;
  const sub = TP.sub, inF = sub==null ? inM : Object.fromEntries(DSK.map(k=>[k, inM[k].filter(r=>r.sub===sub)]));
  const subN = Object.fromEntries(subsOf(m).map(s=>[s, Object.fromEntries(DSK.map(k=>[k, inM[k].filter(r=>r.sub===s).length]))]));
  const subMx = Math.max(1, ...Object.values(subN).flatMap(o=>DSK.map(k=>o[k]/Math.max(1,inM[k].length))));

    <p>Pick a major topic, then one of its subtopics, to see how much attention each source gives it, how that changes over time, and the records behind the numbers.</p></div>
    <div class="legend">${DSK.map(k=>`<span class="${DS[k].cls}"><i class="dot"></i>${DS[k].short}</span>`).join('')}</div></div>
  <div class="tp">
    <nav class="tlist" aria-label="Topics"><p class="tl-note"><span class="chev" aria-hidden="true">›</span> Click a major topic to see its subtopics.</p>${MAJORS().map(t=>`<button class="titem" data-m="${t}" aria-pressed="${t===m && sub==null}" aria-expanded="${t===m}" title="${t===m?'':'Show subtopics'}"><span class="chev" aria-hidden="true">›</span><span class="code">${t}</span><span class="nm">${esc(CB.majors[t])}</span>

      ${t===m ? `<div class="tsubs" role="group" aria-label="Subtopics of ${esc(CB.majors[t])}">${subsOf(t).map(s=>{ const n=subN[s], z=DSK.every(k=>!n[k]);
        return `<button class="titem tsub ${z?'zero':''}" data-s="${s}" aria-pressed="${sub===s}"><span class="code">${s}</span><span class="nm" title="${esc(CB.subs[s])}">${esc(CB.subs[s])}</span>
          <span class="mini">${DSK.map(k=>`<i class="${DS[k].cls}" style="width:${n[k]?Math.max(2, n[k]/Math.max(1,inM[k].length)/subMx*70):0}px"></i>`).join('')}</span></button>`; }).join('')}</div>` : ''}`).join('')}</nav>

          <span class="v">${pct(inF[k].length/base[k].length)}</span><span class="s">${fmt(inF[k].length)} of ${fmt(base[k].length)} policy items${sub!=null && inM[k].length ? ` · ${pct(inF[k].length/inM[k].length,0)} of its ${esc(CB.majors[m].split(/,| and /)[0])} items` : ''}</span></div>`).join('')}</div></div>

      <div class="panel"><div class="chead"><h3>Top 5 sponsors of ${esc(sub==null ? CB.majors[m] : CB.subs[sub])} bills</h3><span class="muted" style="font-size:12px">Primary sponsors, ${esc(SESSIONS.length>1?'all sessions':gaName(LATEST))}</span></div><div id="tp-sp"></div></div>
      ${sub==null ? `<div class="panel"><div class="chead"><h3>Subtopics</h3><span class="muted" style="font-size:12px">Records coded to each subtopic. Click a row to open it.</span></div>
        <div class="hscroll"><table class="subtab"><thead><tr><th>Code</th><th>Subtopic</th>${DSK.map(k=>`<th class="${DS[k].cls}"><i class="dot"></i> ${DS[k].short}</th>`).join('')}</tr></thead>
        <tbody>${subsOf(m).map(s=>`<tr data-s="${s}"><td><span class="code">${s}</span></td><td>${esc(CB.subs[s])}</td>${DSK.map(k=>`<td class="${subN[s][k]?'':'z'}">${fmt(subN[s][k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>` : ''}

  $$('.subtab tbody tr').forEach(tr=>tr.addEventListener('click', ()=>{ pickSub(+tr.dataset.s); scrollTo({top:0}); }));

  topSponsors(inF.bills);

}
function topSponsors(bills){
  const by = new Map(); for (const r of bills){ const c = chiefOf(r); if (!c) continue; const o = by.get(c.i) || {p:c, n:0, law:0}; o.n++; if (r.x.stage>=5) o.law++; by.set(c.i, o); }
  const top = [...by.values()].sort((a,b)=>b.n-a.n || b.law-a.law || a.p.name.localeCompare(b.p.name)).slice(0,5);
  const el = $('#tp-sp'); if (!el) return;
  if (!top.length){ el.innerHTML = '<p class="muted" style="margin:0">No bills in this topic list a sponsor.</p>'; return; }
  const mx = top[0].n;
  el.innerHTML = `<ol class="topsp">${top.map(o=>`<li><span class="rk num">${top.indexOf(o)+1}</span>
      <div style="min-width:0"><div>${spLink(o.p)} <span class="muted" style="font-size:12.5px">· ${chamberName(o.p.ch)}</span></div>
      <div class="tsbar"><i style="width:${(o.n/mx*100).toFixed(1)}%"></i></div></div>
      <span class="num tsn"><b>${pl(o.n,'bill')}</b><span class="muted">${o.law ? `${fmt(o.law)} became law` : 'none became law'}</span></span></li>`).join('')}</ol>
    <p class="muted" style="margin:0;font-size:12px">Out of ${pl(bills.length,'bill')} in this topic. Click a name for the legislator's page.</p>`;
}
function topicList(inM){
  const rows = DSK.filter(k=>TP.ds==='all'||TP.ds===k).flatMap(k=>inM[k])
    .sort((a,b)=>(b.date||String(b.year||0)).localeCompare(a.date||String(a.year||0)));
  $('#tp-lt').innerHTML = `${fmt(rows.length)} records${TP.sub==null?' in all subtopics':''}`;
  const PS=12, pages=Math.ceil(rows.length/PS); TP.page=Math.min(TP.page,Math.max(0,pages-1));
  $('#tp-res').innerHTML = rows.slice(TP.page*PS, TP.page*PS+PS).map(r=>card(r,[])).join('') || '<p class="muted">No records.</p>';
  pager($('#tp-pg'), TP.page, pages, p=>{ TP.page=p; topicList(inM); $('#tp-lt').scrollIntoView({block:'start'}); });
}

/* =================== SEARCH =================== */
const SR = { q:'', ds:new Set(DSK), major:null, y0:1991, y1:2026, page:0, sort:'new', gas:'latest' };
function srFilter(){ const t=parseQuery(SR.q); if (!t.length) return [];
  return R.filter(r=>SR.ds.has(r.ds) && (r.ds!=='bills' || SR.gas==='all' || r.x.ga===LATEST) && (SR.major==null || r.major===SR.major) && (r.year==null || (r.year>=SR.y0 && r.year<=SR.y1)) && t.every(w=>r.hay.includes(w))); }
function renderSearch(){
  $('#view').innerHTML = `
  <div class="phead"><div><div class="eyebrow">Keyword search · all datasets</div><h1>Search</h1>
    <p>Find every bill, speech sentence and report that mentions a word or phrase. Put phrases in quotes. All words must appear.</p></div></div>
  <div class="bigsearch"><input type="search" id="q" placeholder='e.g. "minimum wage", pension, transit' value="${esc(SR.q)}" aria-label="Keyword search"></div>
  <div class="sugg">Try: ${['"property tax"','pension','medicaid','transit','"minimum wage"','cannabis','broadband','"climate"'].map(s=>`<button data-s='${s}'>${esc(s.replace(/"/g,''))}</button>`).join('')}</div>
  <div class="fbar" style="margin-top:16px">
    ${DSK.map(k=>`<label class="check ${DS[k].cls}"><input type="checkbox" data-ds="${k}" ${SR.ds.has(k)?'checked':''}><i class="dot"></i>${DS[k].name} <span class="muted num" id="sc-${k}"></span></label>`).join('')}
    ${SESSIONS.length>1?`<select id="sr-ga" aria-label="Bill sessions"><option value="latest">Bills: ${gaName(LATEST)} only</option><option value="all" ${SR.gas==='all'?'selected':''}>Bills: all ${SESSIONS.length} sessions (larger download)</option></select>`:''}
    <select id="sr-m" aria-label="Topic">${majorOptions(SR.major)}</select>
    <span class="ink2" style="font-size:13.5px">Years</span><input type="number" id="sr-y0" value="${SR.y0}" min="1991" max="2026" style="width:82px" aria-label="From year"><input type="number" id="sr-y1" value="${SR.y1}" min="1991" max="2026" style="width:82px" aria-label="To year">
  </div>
  <div id="sr-body"></div>`;
  let deb; $('#q').addEventListener('input', e=>{ clearTimeout(deb); deb=setTimeout(()=>{ SR.q=e.target.value; SR.page=0; srUpdate(); },180); });
  $$('.sugg button').forEach(b=>b.addEventListener('click', ()=>{ SR.q=b.dataset.s; $('#q').value=SR.q; SR.page=0; srUpdate(); }));
  $$('[data-ds]').forEach(c=>c.addEventListener('change', e=>{ e.target.checked?SR.ds.add(e.target.dataset.ds):SR.ds.delete(e.target.dataset.ds); SR.page=0; srUpdate(); }));
  $('#sr-ga')?.addEventListener('change', async e=>{ SR.gas=e.target.value; SR.page=0; await withLoading(need(needsFor({view:'search'}))); srUpdate(); });
  $('#sr-m').addEventListener('change', e=>{ SR.major=e.target.value===''?null:+e.target.value; SR.page=0; srUpdate(); });
  const yr=()=>{ const a=+$('#sr-y0').value||1991, b=+$('#sr-y1').value||2026; SR.y0=Math.min(a,b); SR.y1=Math.max(a,b); SR.page=0; srUpdate(); };
  $('#sr-y0').addEventListener('change', yr); $('#sr-y1').addEventListener('change', yr);
  srUpdate();
}
function srUpdate(){
  const body = $('#sr-body'), terms = parseQuery(SR.q);
  if (!terms.length){ DSK.forEach(k=>$('#sc-'+k).textContent=''); body.innerHTML = `<div class="panel" style="align-items:flex-start"><h3>Start with a keyword</h3><p class="ink2" style="margin:0">Results show up here with a chart of how often the term appears in each source over time, the topics it is coded under, and a CSV download of every match.</p></div>`; return; }
  const rows = srFilter(); const c = count(rows, r=>r.ds);
  DSK.forEach(k=>$('#sc-'+k).textContent = `(${fmt(c.get(k)||0)})`);
  body.innerHTML = `
  <div class="grid-wide">
    <div class="panel"><div class="chead"><h3>How often each source mentions it</h3><div class="legend">${DSK.filter(k=>SR.ds.has(k)).map(k=>`<span class="${DS[k].cls}"><i class="dot"></i>${DS[k].short}</span>`).join('')}</div></div>
      <div class="muted" style="font-size:12px;margin-top:-6px">Share of each source's records per year that contain the search terms</div><div id="sr-ln"></div></div>
    <div class="panel"><div class="chead"><h3>Topics of the matches</h3><span class="muted" style="font-size:12px">Click to filter</span></div><div id="sr-tp"></div></div>
  </div>
  <div class="fbar"><div class="count" style="margin-left:0"><span><b class="num" style="color:var(--ink)">${fmt(rows.length)}</b> matches</span>

    <button class="btn primary" id="sr-dl" ${rows.length?'':'disabled'}>Download ${fmt(rows.length)} matches (CSV)</button></div></div>
  <div class="results" id="sr-res"></div><div class="pager" id="sr-pg"></div>`;

  if (xs.length > 1) lines($('#sr-ln'), xs, DSK.filter(k=>SR.ds.has(k)).map(k=>{ const all=byDs(k).filter(r=>(SR.major==null||r.major===SR.major) && (k!=='bills' || SR.gas==='all' || r.x.ga===LATEST)); const tot=count(all,r=>r.year), hit=count(rows.filter(r=>r.ds===k),r=>r.year);
    return {label:DS[k].short, cls:DS[k].cls, color:'--s-'+k, pts:xs.filter(y=>(tot.get(y)||0)>=(k==='tt'?8:20)).map(y=>[y,(hit.get(y)||0)/tot.get(y),hit.get(y)||0,tot.get(y)])}; }), {height:200});
  const tc = count(rows.filter(isPol), r=>r.major);
  const items = [...tc].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>({label:CB.majors[k], code:k, value:v, color:'--h4', on:SR.major===k,
    segs: subSegs(rows, k, 1, (c,n)=>DSK.map(d=>tipRow(DS[d].cls, DS[d].short, fmt(rows.filter(r=>r.ds===d&&r.sub===c).length))).join('')),
    tip: DSK.map(d=>tipRow(DS[d].cls, DS[d].short, fmt(rows.filter(r=>r.ds===d&&r.major===k).length))).join(''), onclick:()=>{ SR.major = SR.major===k?null:k; $('#sr-m').value=SR.major??''; SR.page=0; srUpdate(); }}));
  if (items.length) hbars($('#sr-tp'), items, {labelW:190, rowH:24}); else $('#sr-tp').innerHTML = '<p class="muted">No coded matches.</p>';
  $('#sr-sort').value = SR.sort; $('#sr-sort').addEventListener('change', e=>{ SR.sort=e.target.value; SR.page=0; srUpdate(); });
  $('#sr-dl').addEventListener('click', ()=>save(`illinois-search-${slug(SR.q)||'results'}.csv`, csvFor(rows)));
  const dk = r => r.date || String(r.year||0);
  rows.sort((a,b)=> SR.sort==='new' ? dk(b).localeCompare(dk(a)) || a.id-b.id : dk(a).localeCompare(dk(b)) || a.id-b.id);
  const PS=20, pages=Math.ceil(rows.length/PS); SR.page=Math.min(SR.page,Math.max(0,pages-1));

  pager($('#sr-pg'), SR.page, pages, p=>{ SR.page=p; srUpdate(); $('#sr-res').scrollIntoView({block:'start'}); });
}

/* =================== RECORD PAGES ===================
   Every bill, report and address has its own page at #bill-HB1234, #report-806 or #speech-2025 (#speech-2025-s123 opens at a sentence).
   A page is a header plus a list of SECTIONS. To add a feature to every page of a kind, push a section:
     SECTIONS.bill.push({ id:'votes', title:'Roll-call votes', side:false, render(rec, el, page){ el.innerHTML = '...'; } })
   `side:true` puts it in the right-hand column; return false from show(rec) to skip it for a record. */
const SECTIONS = { bill:[], report:[], speech:[] };
const ACTS = {};  // bill histories per session, fetched the first time a bill page from that session opens
const loadActs = ga => ACTS[ga] ||= get(`bills/${ga}/actions`);

function recordFor(rt){
  if (rt.view==='bill'){ const r = BILLKEY.get(rt.ga ? `${rt.ga}-${rt.key}` : [...SESSIONS].reverse().map(s=>`${s.ga}-${rt.key}`).find(k=>BILLKEY.has(k))); return r && {kind:'bill', rec:r}; }
  if (rt.view==='report'){ const r = byDs('tt').find(r=>r.id===rt.key); return r && {kind:'report', rec:r}; }
  if (rt.view==='org'){ orgs(); const o = ORGKEY.get(rt.key); if (o && OG.slug!==o.slug) Object.assign(OG,{slug:o.slug, q:'', major:null, page:0}); return o && {kind:'org', rec:o}; }
  if (rt.view==='sponsor'){ const p = SPONKEY.get(rt.key); if (p && SPG.slug!==p.slug) { /* open on the bills that became law: their own if any, else any they sponsored; all bills if none became law */
      const lawC = p.bills.some(b=>b.role==='C' && b.r.x.stage>=5), lawAny = p.bills.some(b=>b.r.x.stage>=5);
      Object.assign(SPG,{slug:p.slug, role: lawC || !lawAny ? (p.bills.some(b=>b.role==='C')?'C':'all') : 'all', major:null, law:lawAny, page:0}); } return p && {kind:'sponsor', rec:p}; }
  if (rt.view==='speech'){ const s = byDs('sots').filter(r=>r.year===rt.year).sort((a,b)=>a.id-b.id); return s.length && {kind:'speech', rec:{year:rt.year, sent:s, gov:s[0].x.governor, sid:rt.sid}}; }
}
const HEADS = {
  bill: (r, page) => { const x=r.x, B=x.type==='HB'||x.type==='SB';
    return { crumb:['bills','Bills'], eyebrow:`${esc(BILLTYPE[x.type]||x.type)} · ${esc(x.chamber)} · ${gaName(x.ga)}`, title:esc(x.bill), sub:esc(x.short),
      chips:(x.pa?`<span class="chip">Public Act ${esc(x.pa)}</span>`:'')+[...x.flags].filter(f=>!(f==='L' && x.pa)).map(f=>`<span class="chip">${f==='L' && B ? 'Became law' : FLAGS[f]}</span>`).join(''),
      actions:`<a class="btn" href="${ilga(x)}" target="_blank" rel="noopener">Status on ilga.gov ↗</a>` }; },
  report: (r) => ({ crumb:['thinktanks','Think tanks'], eyebrow:`${orgLink(r.x.org)} · ${r.x.date||r.x.year||'Undated'}`, title:esc(r.title), sub:'',
      chips:'', actions:`<a class="btn" href="${esc(r.x.url)}" target="_blank" rel="noopener">Report page ↗</a>${r.x.pdf?`<a class="btn" href="${esc(r.x.pdf)}" target="_blank" rel="noopener">PDF ↗</a>`:''}` }),
  org: (o) => { const P = ORGPROF[o.name] || {}, web = orgWebsite(o);
    return { crumb:['thinktanks','Think tanks'], logo:orgLogo(o, 'lg'),
      eyebrow:[P.official_name && P.official_name!==o.name ? esc(P.official_name) : 'Think tank or policy institute', P.founded && `Founded ${P.founded}`, P.based && esc(P.based)].filter(Boolean).join(' · '),
      title:esc(o.name), sub:'', chips:'', actions: web ? `<a class="btn" href="${esc(web.url)}" target="_blank" rel="noopener">${esc(web.host)} ↗</a>` : '' }; },
  sponsor: (p) => ({ crumb:['sponsors','Sponsors'], eyebrow:`${p.ch==='Rep'?'State Representative':'State Senator'} · ${esc(p.gas().map(gaName).join(', '))}`, title:esc(p.title), sub:'',
      chips:'', actions:'' }),
  speech: (s) => { const yrs = range(2005,2025);
    return { crumb:['speeches','Speeches'], eyebrow:`State of the State address${GOV[s.year]?.party ? ' · ' + esc(GOV[s.year].party) + ' governor' : ''}`, title:`${s.year} · ${esc(s.gov)}`, sub:'',
      chips:'', actions:`${s.year>yrs[0]?`<a class="btn" href="#speech-${s.year-1}">← ${s.year-1}</a>`:''}${s.year<yrs[yrs.length-1]?`<a class="btn" href="#speech-${s.year+1}">${s.year+1} →</a>`:''}` }; }
};
const recRows = (kind, rec) => kind==='org' ? newest(rec.reports) : kind==='speech' ? rec.sent : kind==='sponsor' ? newest(rec.bills.map(b=>b.r)) : [rec];
const recFile = (kind, rec) => kind==='org' ? `illinois-${rec.slug}-reports.csv` : kind==='sponsor' ? `illinois-${rec.slug}-bills.csv` : kind==='speech' ? `illinois-state-of-the-state-${rec.year}.csv` : kind==='bill' ? `illinois-${rec.x.ga}-${rec.x.bill.replace(' ','').toLowerCase()}.csv` : `illinois-report-${rec.id}-${slug(rec.title)}.csv`;

function renderRecord(){
  const found = recordFor(ROUTE);
  if (!found){ $('#view').innerHTML = `<div class="panel" style="max-width:640px"><h2>Record not found</h2><p class="ink2" style="margin:0">Nothing in the data matches <span class="mono">#${esc(CUR)}</span>. The link may have a typo.</p><div><a class="btn" href="#${tabOf(ROUTE)}">Back to ${esc(TABS.find(t=>t&&t[0]===tabOf(ROUTE))[1])}</a></div></div>`; return; }
  const {kind, rec} = found, h = HEADS[kind](rec, found);

/* =================== SPONSORS ===================
   SPON[i] = {name, ch:'Rep'|'Sen', title, slug, bills:[{r, role}]}; each bill record has r.sp = [[i, role], ...].
   Roles come from the order of ILGA's sponsor list: C primary sponsor, H primary co-sponsor, O co-sponsor,
   S / T sponsor and co-sponsor in the second chamber. */
const ROLE = {C:'Primary sponsor', H:'Primary co-sponsor', O:'Co-sponsor', S:'Second-chamber sponsor', T:'Second-chamber co-sponsor'};
let SPON = [], SPONKEY = new Map();
function buildSponsors(people){
  const ascii = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  SPON = people.map(([ch,name],i)=>({i, ch, name, title:(ch==='Rep'?'Rep. ':'Sen. ')+name, slug:(ch==='Rep'?'rep-':'sen-')+ascii(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''), bills:[],
    gas(){ return [...new Set(this.bills.map(b=>b.r.x.ga))].sort((a,b)=>a-b); }}));
  SPONKEY = new Map(SPON.map(p=>[p.slug,p]));
}
function attachLinks(links){
  for (const [key, list] of Object.entries(links)){ const r = BILLKEY.get(key); if (!r) continue; r.sp = list; for (const [i,role] of list) SPON[i].bills.push({r, role}); }
}
const chiefOf = r => { const c = (r.sp||[]).find(([,ro])=>ro==='C'); return c ? SPON[c[0]] : null; };
const spLink = p => `<a class="spn" href="#sponsor-${p.slug}">${esc(p.title)}</a>`;
const chamberName = ch => ch==='Rep' ? 'House' : 'Senate';
const isBillHBSB = r => r.x.type==='HB' || r.x.type==='SB';
function sponsorStats(p, major, sub=null){
  const bs = p.bills.filter(b=>(major==null || b.r.major===major) && (sub==null || b.r.sub===sub)); const n = k => bs.filter(b=>b.role===k).length;
  const chief = bs.filter(b=>b.role==='C'), cb = chief.filter(b=>isBillHBSB(b.r));
  const tc = [...count(chief.filter(b=>isPol(b.r)), b=>b.r.major)].sort((a,b)=>b[1]-a[1])[0];
  return {all:bs.length, C:n('C'), H:n('H'), O:n('O'), S:n('S'), T:n('T'), law:cb.filter(b=>b.r.x.stage>=5).length, bills:cb.length, top:tc?tc[0]:null};
}

let ORGS_CACHE;
function orgs(){
  if (ORGS_CACHE) return ORGS_CACHE;
  const by = new Map();
  for (const r of byDs('tt')){ const n = r.x.org; if (!by.has(n)) by.set(n, []); by.get(n).push(r); }
  ORGS_CACHE = [...by].map(([name, reports])=>{
    const hosts = count(reports.map(r=>{ try { return new URL(r.x.url).hostname.replace(/^www\./,''); } catch { return null; } }).filter(Boolean), h=>h);
    const site = [...hosts].sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
    return {name, slug:name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''), reports, site};
  }).sort((a,b)=>b.reports.length-a.reports.length);
  ORGKEY = new Map(ORGS_CACHE.map(o=>[o.slug,o]));
  return ORGS_CACHE;
}

        `<p class="muted" style="margin:0;font-size:12px">Overlap of topic mix, 0–100 (cosine similarity of major-topic shares). 100 means the same mix.</p>`; } },
  { id:'related', title:'Their topics elsewhere', side:true, render(o, el){
      const subs = [...count(o.reports.filter(isPol), r=>r.sub)].sort((a,b)=>b[1]-a[1]).slice(0,4);
      el.innerHTML = `<p class="ink2" style="margin:0;font-size:13px">How often bills and governors take up this organization's most frequent subtopics.</p>` + subs.map(([s,n])=>{
        const b = byDs('bills').filter(r=>r.sub===s).length, sp = byDs('sots').filter(r=>r.sub===s).length;
        return `<button class="subrow" data-s="${s}"><span><span class="code">${s}</span> ${esc(CB.subs[s])}</span><span class="muted num" style="font-size:12px">${pl(n,'report')} · ${pl(b,'bill')} · ${pl(sp,'speech sentence')}</span></button>`; }).join('');
      $$('.subrow', el).forEach(btn=>btn.addEventListener('click', ()=>{ const s=+btn.dataset.s; Object.assign(TP,{major:Math.floor(s/100), sub:s, ds:'all', page:0}); nav('topics'); })); } }
);

/* =================== shell & routing =================== */
const RENDER = {home:renderHome, bills:()=>{ BL.view='intro'; renderBills(); }, 'bills-committee':()=>{ BL.view='committee'; renderBills(); }, 'bills-law':()=>{ BL.view='law'; renderBills(); }, 'bills-activity':()=>{ BL.view='activity'; renderBills(); }, speeches:renderSpeeches, thinktanks:renderThinkTanks, topics:renderTopics, sponsors:renderSponsors, search:renderSearch};
let CUR = null, ROUTE = {view:'bills'}; const STACK = [];
function parseRoute(t){
  if (RENDER[t]) return {view:t};
  let m;
  if ((m = /^bill-(\d+)-([A-Z]+\d+)$/.exec(t))) return {view:'bill', ga:+m[1], key:m[2]};
  if ((m = /^bill-([A-Z]+\d+)$/.exec(t))) return {view:'bill', ga:null, key:m[1]};  // older links: newest session with that number
  if ((m = /^report-(\d+)$/.exec(t))) return {view:'report', key:+m[1]};
  if ((m = /^sponsor-([a-z0-9-]+)$/.exec(t))) return {view:'sponsor', key:m[1]};
  if ((m = /^org-([a-z0-9-]+)$/.exec(t))) return {view:'org', key:m[1]};
  if ((m = /^speech-(\d{4})(?:-s(\d+))?$/.exec(t))) return {view:'speech', year:+m[1], sid:m[2]?+m[2]:null};
  return null;
}
const tabOf = rt => ({'bills-committee':'bills', 'bills-law':'bills', 'bills-activity':'bills', bill:'bills', report:'thinktanks', org:'thinktanks', speech:'speeches', sponsor:'sponsors'})[rt.view] || rt.view;
function navHTML(side){ const cur = tabOf(ROUTE), groups = ['Datasets','Explore']; let g = 0;
  return TABS.map(t=> t ? `<button role="tab" data-v="${t[0]}" aria-selected="${t[0]===cur}">${t[2]?`<i class="dot ${t[2]}"></i>`:''}${t[1]}</button>` : (side?`<div class="lbl">${groups[g++]||''}</div>`:'<span class="sep"></span>')).join(''); }
function drawNav(){ $('nav.tabs').innerHTML = navHTML(false); $$('[data-v]').forEach(b=>b.addEventListener('click', ()=>nav(b.dataset.v))); }
/* nav(token): go to a tab or record page, remembering where we came from */
function nav(token, {record=true, keep=false}={}){
  if (!parseRoute(token)) token = 'bills';
  if (record && CUR && CUR !== token){ STACK.push({token:CUR, y:scrollY}); if (STACK.length > 60) STACK.shift(); try { history.pushState(null,'','#'+token); } catch {} }
  else { try { history.replaceState(null,'','#'+token); } catch {} }
  CUR = token; ROUTE = parseRoute(token); drawNav(); hideTip(); try { localStorage.setItem('ilpa2-view', token); } catch {}
  if (!R.length) return;
  const want = needsFor(ROUTE), me = ++navSeq;
  const draw = ()=>{ if (me !== navSeq) return; (RENDER[ROUTE.view] || renderRecord)(); if (!keep) scrollTo({top:0}); };
  const pending = [...want.details.filter(g=>!LOADED.details.has(g)), ...want.links.filter(g=>!LOADED.links.has(g))];
  if (!pending.length) return draw();
  withLoading(need(want)).then(draw);
}
let navSeq = 0;
/* which session files a view needs: bill text for search and bill pages, sponsor links for anything about sponsors */
function needsFor(rt){
  const all = allGAs();
  switch (rt.view){
    case 'bills': case 'bills-committee': case 'bills-law': case 'bills-activity': return {details:[BL.ga ?? LATEST], links:[BL.ga ?? LATEST]};
    case 'bill': { const r = recordFor(rt)?.rec; return {details:r?[r.x.ga]:[], links:all}; }
    case 'search': return {details: SR.gas==='latest' ? [LATEST] : all, links:all};
    case 'topics': case 'sponsors': case 'sponsor': return {details:[], links:all};
    default: return {details:[], links:[]};
  }
}
function withLoading(p){
  const t = setTimeout(()=>{ $('#view').insertAdjacentHTML('afterbegin', '<div class="loadbar" id="loadbar">Loading session data…</div>'); }, 150);
  return p.catch(e=>toast('Could not load data: ' + e.message)).finally(()=>{ clearTimeout(t); $('#loadbar')?.remove(); });
}
function back(){ const p = STACK.pop(); if (!p) return nav(tabOf(ROUTE), {record:false}); nav(p.token, {record:false}); scrollTo({top:p.y}); }
document.addEventListener('click', e=>{ const a = e.target.closest('a[href^="#"]'); if (!a || e.metaKey || e.ctrlKey) return; const t = a.getAttribute('href').slice(1); if (!parseRoute(t)) return; e.preventDefault(); nav(t); });
addEventListener('popstate', ()=>{ const t = location.hash.slice(1); if (parseRoute(t) && t !== CUR){ if (STACK.length && STACK[STACK.length-1].token === t) return back(); nav(t, {record:false}); } });
addEventListener('hashchange', ()=>{ const t = location.hash.slice(1); if (parseRoute(t) && t !== CUR) nav(t); });
let lastW = innerWidth, rz; addEventListener('resize', ()=>{ if (Math.abs(innerWidth-lastW)<40) return; lastW=innerWidth; clearTimeout(rz); rz=setTimeout(()=>{ if (R.length) nav(CUR, {record:false, keep:true}); },250); });
let start = location.hash.slice(1); if (!parseRoute(start||'')) start='home';
nav(start, {record:false});
load().then(()=>nav(CUR, {record:false, keep:true})).catch(e=>{ $('#view').innerHTML = `<div class="loading">Could not load the data files (${esc(e.message)}). Reload the page to try again.</div>`; });
</script>
