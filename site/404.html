<title>Page not found · Illinois Policy Agendas Project</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- GitHub Pages serves this for any address that is not a file. The site's pages live after a #, so an address
     like /bill-104-HB35 or /sponsor-rep-... is sent on to /#bill-104-HB35; anything the site doesn't know opens the home page. -->
<script>
  (function(){ var p = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^[A-Za-z0-9-]+$/.test(p)) location.replace('/#' + p + location.search);
    else if (!p || /^(index\.html)?$/.test(p)) location.replace('/'); })();
</script>
