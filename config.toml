# Illinois Policy Agendas Project (IPAP) website: where the data comes from and where the site goes.
# Two kinds of paths:
#   data   (bill scrapes, coding files, speeches, reports, subtopic index, governors) are relative to the Dropbox
#          folder IAP/Website, which the "Update website" launcher passes in. "../Bills/..." means IAP/Bills/...
#   content (home page text, think tank profiles, logos) live in this repository under content/.

title = "Illinois Policy Agendas Project"

[codebook]
# The project's Illinois subtopic index: topic labels shown on the site and the list of valid codes.
file = "../illinois_subtopic_index.csv"
columns = { label = "subtopic_name", code = "", major = "majortopic", major_label = "majortopic_name" }
# Codes to accept even though they are not in the index (none needed now).
extra_codes = []

# Governor and party for each year, used on speech pages and as backdrop on trend charts.
[governors]
file = "../governor_metadata.xlsx"
columns = { year = "year", governor = "governor_name", party = "party" }

# ---------------------------------------------------------------- bills
# One [[bills.sessions]] block per General Assembly. To add a session, copy a block,
# change `ga`, and point `details` at the scraper output for that session.
#   details: the scraped bill file (titles, synopses, sponsors, actions). Any codes in it are used
#            unless a codes file gives a different code.
#   codes:   folder of coding files. Every .xlsx / .csv in it is read. Each needs a `bill` column
#            (e.g. "HB 1234") and a `subtopic` column. Codes here override the details file.
#   actions: folder for ILGA's current status of every bill, written by "Update bills from ILGA"
#            (pipeline/fetch_actions.py) from the General Assembly's public file repository. The build uses it to
#            bring the details file up to date and for the day-by-day session replay; the site works without it.
[[bills.sessions]]
ga = 104
years = "2025-2026"
details = "../Bills/Live data/igbills_2025_2026_complete.xlsx"
codes = "inputs/codes/104"
actions = "inputs/actions/104"
# ILGA's ids for this session, for collecting witness slips (pipeline/fetch_slips.py): GAID and SessionID in
# ilga.gov bill links. Leave out to skip the session.
slips = { gaid = 18, session = 114 }

# Placeholder for the next General Assembly. While the bill file below doesn't exist, the site lists the
# session as "not started" and the check passes. Once the scraper saves the file there, it goes live by itself;
# then delete the `status` line. Rename `details` if the scraper uses a different file name.
[[bills.sessions]]
ga = 105
years = "2027-2028"
starts = "January 2027"
status = "upcoming"
details = "../Bills/Live data/igbills_2027_2028_complete.xlsx"
codes = "inputs/codes/105"
actions = "inputs/actions/105"

# Which measures count as "substantive bills" (everything else is left out of the site).
[bills]
include_types = ["HB", "SB"]      # House and Senate bills; drops resolutions, appointment messages, executive orders
exclude_flags = ["C", "N"]        # C = commemorative, N = nomination

# Column names in the scraped bill files (change these if the scraper output changes).
[bills.columns]
bill = "bill_title"
link = "html_link"
sponsors = "sponsors"
introduced = "first_intro_date"
last_action_date = "last_action_date"
last_action = "last_action"
actions = "all_actions"
synopsis = "bill_text"
short = "shortdesc"
chamber = "chamber"
subtopic = "minor_code"
became_law = "became_law"
commemorative = "commemorative"
appropriation = "appropriation"
nomination = "nomination"
roll_call = "roll_call_vote"

# Column names in the coders' files.
[bills.code_columns]
bill = "bill"
subtopic = "subtopic"

# ---------------------------------------------------------------- speeches and reports
[sots]
file = "../SOTS/IL_SOTS_2005_2025.xls"
columns = { id = "id", governor = "governor", year = "year", text = "text", subtopic = "minortopic" }

# Party, district and photo for each legislator. Made by "Fetch legislators" (pipeline/fetch_legislators.py) from ilga.gov;
# photos go in content/legislators/photos/. Lives in this repository, like the think tank profiles.
[legislators]
file = "content/legislators/members.csv"

# Google Sheet where coders code new bills and bills an amendment rewrote (pipeline/coding_sheet.py; setup in the
# README). Each update from GitHub adds those bills to it and reads its codes, which override the bill file and coding
# files. `id` is the long part of the sheet's link between /d/ and /edit; leave it blank to turn the sheet off.
# Visitor counts with GoatCounter (goatcounter.com: free for non-commercial sites, no cookies, no personal data).
# Put the code you chose when signing up, e.g. "ipap" for ipap.goatcounter.com; leave blank for no counting.
# Every page counts, bill and speech pages included; the stats are at https://<code>.goatcounter.com.
[analytics]
goatcounter = "ejfagan"

[coding_sheet]
id = "1jykXDjnBxuSfZo6nZbbL1PmKpAp0OIZJpnTBo7TGJY4"

[thinktanks]
file = "inputs/thinktanks/Illinois Think Tank Reports.xlsx"
profiles = "content/thinktanks/profiles.toml"   # in this repository; bios, and logos in content/thinktanks/logos/
columns = { id = "id", org = "think_tank", date = "date", year = "year", title = "title", abstract = "abstract", url = "url", pdf = "pdf_url", subtopic = "subtopic" }
# New reports found by "Update think tank reports" (pipeline/fetch_reports.py) go here for coders, not into `file`.
# A row appears on the site once it has a subtopic; delete rows that aren't reports.
new = "inputs/thinktanks/new_reports.xlsx"
# An organization with nothing on file yet is collected back to this date (the start of the data).
first_since = "2006-01-01"
# Organizations to look back through again, to pick up reports a run missed (reports on file, or deleted by coders,
# are skipped). Cheap for WordPress sources; it can be emptied once the missing reports are in.
recheck = []

# Where to look for each organization's new reports. `org` must match the think_tank column.
#   kind = "wp"     a WordPress site's listing (`type` is the post type: "posts", or e.g. "report")
#   kind = "links"  links on a listing page whose address matches `match` (a regular expression)
#   kind = "rss"    an RSS or Atom feed (`url`)
# Options: for "wp", `query` adds filters to the WordPress listing (e.g. "categories=99" or "search=report");
# for "links", `urls` lists several listing pages, or `pages = [first, last]` fills {n} in `url`, and `exclude` skips
# matching addresses. The collector reads only what each site's robots.txt allows.
# An organization with no entry here is collected by hand.
[[thinktanks.sources]]
org = "Illinois Policy"
kind = "wp"
site = "https://www.illinoispolicy.org"
type = "report"

[[thinktanks.sources]]
org = "Illinois Economic Policy Institute"
kind = "rss"   # its WordPress listing now refuses the collector (401); its feed is open, ten posts a page
url = "https://www.illinoisepi.org/feed/?paged={n}"
pages = [1, 5]

[[thinktanks.sources]]
org = "Center for Tax and Budget Accountability"
kind = "links"
url = "https://www.ctbaonline.org/reports"
match = "^/reports/[^/?#]+$"

[[thinktanks.sources]]
org = "Center for Neighborhood Technology"
kind = "links"
url = "https://cnt.org/publications"
match = "^/publications/[^/?#]+$"

[[thinktanks.sources]]
org = "Institute for Government and Public Affairs"
kind = "links"
url = "https://igpa.uillinois.edu/reports/"
match = "^/the-repository/[^/?#]+$"

[[thinktanks.sources]]
org = "Delta Institute"
kind = "wp"
site = "https://delta-institute.org"
type = "posts"

[[thinktanks.sources]]
org = "Chicago Urban League"
kind = "links"
url = "https://chiul.org/research/"
match = "/wp-content/uploads/.+\\.pdf$"

# ---- added November 2026: Illinois organizations that publish research on state policy (see the review of
# missing think tanks). Each source points at the organization's reports, not its news, events or press releases.
# Collected by hand: Paul Simon Public Policy Institute (its papers sit on a staging server), UIS Center for State
# Policy and Leadership (no report links on its pages), DePaul Institute for Housing Studies (its site refuses the collector).
[[thinktanks.sources]]
org = "Civic Federation"
kind = "links"   # the State of Illinois listing: reports and issue briefs, not blog posts or press statements
url = "https://www.civicfed.org/governments/state-illinois?page={n}"
pages = [0, 64]
match = "^/(?:index%2Ephp/)?(?:(?:civic-federation|iifs)/publications/|iifs/)?[A-Za-z0-9_-]+$"   # newer reports sit at the root; older ones under /civic-federation/publications/ and /iifs/publications/
exclude = "^/(?:index%2Ephp/)?(?:iifs/)?(?:library|membership|members|about-us|timeline|Financials|ournews|newsletters|commentary|pressroom|news|updates|localgovthub|glossary|events|join|donate|careers|user|search|iifs|blogs?|press|civicfederation)$"

[[thinktanks.sources]]
org = "Metropolitan Planning Council"
kind = "wp"
site = "https://metroplanning.org"
type = "resource"
query = "resource-category=34"   # Publication (not video, maps, audio or presentations)

[[thinktanks.sources]]
org = "Advance Illinois"
kind = "links"
urls = ["https://www.advanceillinois.org/research-hub-archives", "https://www.advanceillinois.org/research-hub/the-state-were-in",
        "https://www.advanceillinois.org/research-hub/early-childhood-education-care", "https://www.advanceillinois.org/research-hub/higher-education",
        "https://www.advanceillinois.org/research-hub/equitable-funding-resources", "https://www.advanceillinois.org/research-hub/strong-diverse-educator-pipeline",
        "https://www.advanceillinois.org/research-hub/engaged-families-whole-student-supports", "https://www.advanceillinois.org/research-hub/data-assessments-accountability",
        "https://www.advanceillinois.org/research-hub/learning-renewal-rebuilding", "https://www.advanceillinois.org/research-hub/standards-rigor-strong-transitions"]
match = "\\.pdf$"

[[thinktanks.sources]]
org = "Health & Medicine Policy Research Group"
kind = "wp"
site = "https://www.hmprg.org"
type = "posts"
query = "categories=99"   # Resource Library

[[thinktanks.sources]]
org = "Latino Policy Forum"
kind = "wp"
site = "https://latinopolicyforum.org"
type = "publication"

[[thinktanks.sources]]
org = "Wirepoints"
kind = "wp"
site = "https://wirepoints.org"
type = "posts"
query = "categories=229"   # Research (not its daily news and commentary)

[[thinktanks.sources]]
org = "UIC Great Cities Institute"
kind = "links"
url = "https://greatcities.uic.edu/research-2/browse-all-reports/page/{n}/"
pages = [1, 10]
match = "^/news-stories/[^/]+/?$"

[[thinktanks.sources]]
org = "Loyola Center for Criminal Justice"
kind = "rss"
url = "https://loyolaccj.org/feed.xml"

[[thinktanks.sources]]
org = "Project for Middle Class Renewal"   # University of Illinois; many reports are written with ILEPI, so check for duplicates
kind = "links"
url = "https://lep.illinois.edu/research-and-publications/policy-reports/"
match = "/wp-content/uploads/.+\\.pdf$"

[[thinktanks.sources]]
org = "John Howard Association"
kind = "links"
urls = ["https://www.thejha.org/special-reports", "https://www.thejha.org/special-reports/tag/2009", "https://www.thejha.org/special-reports/tag/2010",
        "https://www.thejha.org/special-reports/tag/2011", "https://www.thejha.org/special-reports/tag/2012", "https://www.thejha.org/special-reports/tag/2013",
        "https://www.thejha.org/special-reports/tag/2014", "https://www.thejha.org/special-reports/tag/2015", "https://www.thejha.org/special-reports/tag/2016",
        "https://www.thejha.org/special-reports/tag/2017", "https://www.thejha.org/special-reports/tag/2018", "https://www.thejha.org/special-reports/tag/2019",
        "https://www.thejha.org/special-reports/tag/2020", "https://www.thejha.org/special-reports/tag/2021", "https://www.thejha.org/special-reports/tag/2022",
        "https://www.thejha.org/special-reports/tag/2023", "https://www.thejha.org/special-reports/tag/2024", "https://www.thejha.org/special-reports/tag/2025",
        "https://www.thejha.org/special-reports/tag/2026"]
match = "^/special-reports/\\d+$"

[[thinktanks.sources]]
org = "Restore Justice"
kind = "links"
url = "https://restorejustice.org/our-work/reports-factsheets/"
match = "(^/[a-z0-9-]*report[a-z0-9-]*/?$|/app/uploads/.+\\.pdf$)"
exclude = "^/our-work/reports-factsheets/?$|One-Pager-About"

[[thinktanks.sources]]
org = "Chicago Appleseed"
kind = "wp"
site = "https://www.chicagoappleseed.org"
type = "posts"
query = "categories=1163"   # Research

[[thinktanks.sources]]
org = "Illinois Action for Children"
kind = "links"
url = "https://www.actforchildren.org/about/research-data/reports/"
match = "/wp-content/uploads/.+\\.pdf$"

[[thinktanks.sources]]
org = "Illinois Environmental Council"
kind = "wp"
site = "https://ilenviro.org"
type = "posts"
query = "categories=166"   # Reports and Analysis

[[thinktanks.sources]]
org = "Illinois Public Health Institute"
kind = "links"
url = "https://iphionline.org/resources/"
match = "/wp-content/uploads/.+\\.pdf$"

[[thinktanks.sources]]
org = "Housing Action Illinois"
kind = "links"
url = "https://housingactionil.org/what-we-do/publications/"
match = "^/downloads/.+\\.pdf$"

[[thinktanks.sources]]
org = "Reform for Illinois"
kind = "wp"
site = "https://www.reformforillinois.org"
type = "posts"
query = "categories=483"   # Research

# ---------------------------------------------------------------- home page
[site]
home = "content/home/home.toml"   # in this repository; overview, methods, sponsors, people, logos and photos

# ---------------------------------------------------------------- output and publishing
[build]
site_template = "site"      # the website files (index.html)
output = "build"            # the built site goes to build/site, the report to build/report.html

[publish]
# method: "github" commits the site to a GitHub repository served by GitHub Pages (set github_repo)
#         "folder" copies the site into `folder` (a mapped network drive or mounted web folder)
#         "sftp"   uploads changed files to `host`:`remote_dir` (password is asked for, never stored)
#         "zip"    writes a dated zip into `zip_dir` to hand to IT
# With "github", the site is committed to docs/ in this repository; GitHub Pages serves main /docs.
method = "github"
github_repo = "https://github.com/Illinois-Policy-Agendas-Project/illinois-policy-agendas"
github_branch = "main"
folder = ""
host = ""
port = 22
username = ""
remote_dir = "public_html"
zip_dir = "build/releases"
