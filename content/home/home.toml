# People. `photo` is optional (a file in content/home/photos/); without one, initials are shown. In a bio, *asterisks* make italics.
[[people]]
name = "EJ Fagan"
title = "Director and Associate Professor of Political Science, University of Illinois Chicago"
role = "Principal investigator"
bio = "EJ Fagan is an associate professor of political science at the University of Illinois Chicago. He is the director of the Illinois Policy Agendas Project and a co-director of the U.S. Policy Agendas Project. His research examines the role of academics, think tanks and other experts in the policymaking process, policy agenda setting and punctuated equilibrium theory. He is the author of *The Thinkers: The Rise of Partisan Think Tanks and the Polarization of American Politics*."
url = ""
