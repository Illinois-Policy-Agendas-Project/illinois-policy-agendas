# The About page (#about): what the project is, its sources, the team, the license and how to cite it.
# The page also uses `overview`, `methods` and `people` above. {year} in a citation is the current year, {accessed} today's date.
[about]
sources = """Bill text, sponsors, committee referrals and action histories come from the Illinois General Assembly (ilga.gov), as do legislators' photos. Governors' photos are from Wikimedia Commons, credited on the Speeches page. State of the State addresses are the governors' delivered texts, coded one quasi-sentence at a time. Think tank reports are collected from each organization's website; the site links to the original report and, where the link has broken, to an archived copy."""
support = "The Illinois Policy Agendas Project is supported by the Institute of Government and Public Affairs, University of Illinois System, and based in the Department of Political Science at the University of Illinois Chicago. We are looking for long term funding sources to continue to maintain the existing datasets and add more."
license_name = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
license = """The project's data, including its topic codes, the compiled datasets you can download from this site and the codebook, are released under a Creative Commons Attribution 4.0 International license (CC BY 4.0). You may copy, share and adapt them for any purpose, including commercial use, as long as you credit the Illinois Policy Agendas Project, link to the license and say if you made changes."""
license_note = """The license covers the project's own work. Bill text and histories are public records of the Illinois General Assembly. Report titles, abstracts and logos belong to the organizations that published them, and are shown here to identify and describe their work."""
citation = "Fagan, E.J., Annika Ness, and Saraf Wasima. {year}. Illinois Policy Agendas Project [data set]. University of Illinois Chicago. https://www.illinoisagendas.org. Accessed {accessed}."
bibtex = """@misc{ipap{year},
  author = {Fagan, E.J. and Ness, Annika and Wasima, Saraf},
  title = {Illinois Policy Agendas Project},
  year = {{year}},
  publisher = {University of Illinois Chicago},
  howpublished = {\\url{https://www.illinoisagendas.org}},
  note = {Data set. Accessed {accessed}}
}"""
