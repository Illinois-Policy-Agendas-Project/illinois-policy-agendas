# Think tank profiles shown on each organization's page.
#   name      must match the think_tank column in the reports file exactly
#   logo      file in content/thinktanks/logos/ (.svg, .png, .jpg or .webp, ideally under 200 KB).
#             Use the organization's official logo, with its permission. Until a file is there, the page shows a monogram.
#   reviewed  set to true once someone on the team has checked the bio; the build warns about unreviewed bios
#   sources   where the facts in the bio come from (shown on the page)
# Drafted October 2026 from the sources listed. Leadership is left out on purpose because it changes.

[[org]]
name = "Illinois Policy"
official_name = "Illinois Policy Institute"
founded = 2002
based = "Chicago and Springfield"
website = "https://www.illinoispolicy.org"
logo = "illinois-policy.png"
reviewed = false
bio = """A free-market think tank founded in 2002 and relaunched in 2007. It advocates lower taxes and smaller government, and most of its research covers the state budget, public pensions, education and labor policy. It belongs to the State Policy Network of state-level free-market think tanks and has affiliated lobbying and legal arms."""
sources = ["https://en.wikipedia.org/wiki/Illinois_Policy_Institute", "https://www.wbez.org/politics/2017/07/21/a-closer-look-at-the-group-that-could-inform-rauners-agenda"]

[[org]]
name = "Illinois Economic Policy Institute"
official_name = "Illinois Economic Policy Institute (ILEPI)"
founded = 2013
based = "La Grange, Illinois"
website = "https://illinoisepi.org"
logo = "illinois-economic-policy-institute.png"
reviewed = false
bio = """A nonprofit research organization, founded in 2013, that describes itself as nonpartisan and focused on applied research on issues affecting workers, businesses and taxpayers. Its reports cover wages and labor standards, infrastructure funding, energy and tax policy. A regional arm, the Midwest Economic Policy Institute, carries the same work to neighboring states."""
sources = ["https://www.illinoisepi.org/about/", "https://illinoisepi.org/midwest-epi"]

[[org]]
name = "Center for Tax and Budget Accountability"
official_name = "Center for Tax and Budget Accountability (CTBA)"
founded = 2000
based = "Chicago"
website = "https://www.ctbaonline.org"
logo = "center-for-tax-and-budget-accountability.png"
reviewed = false
bio = """A bipartisan nonprofit research organization, founded in 2000, that analyzes tax, spending and economic policy at the state and local level. Much of its work concerns Illinois's fiscal structure and school funding, and it is credited with helping shape the Evidence-Based Funding model for Illinois schools and the state Earned Income Tax Credit."""
sources = ["https://www.ctbaonline.org/about/about-ctba", "https://projects.propublica.org/nonprofits/organizations/364327041"]

[[org]]
name = "Center for Neighborhood Technology"
official_name = "Center for Neighborhood Technology (CNT)"
founded = 1978
based = "Chicago"
website = "https://cnt.org"
logo = "center-for-neighborhood-technology.png"
reviewed = false
bio = """Founded in 1978 by Scott Bernstein and Stan Hallett to connect Chicago's neighborhood movement with the environmental movement. CNT researches urban sustainability and equity, including transportation and housing costs, water and energy. For twenty years it published The Neighborhood Works, and it launched the nonprofits Elevate Energy and the I-GO car-sharing service."""
sources = ["https://cnt.org/node/15", "https://encyclopedia.chicagohistory.org/pages/224.html", "https://en.wikipedia.org/wiki/Center_for_Neighborhood_Technology"]

[[org]]
name = "Institute for Government and Public Affairs"
official_name = "Institute of Government and Public Affairs (IGPA), University of Illinois System"
founded = 1947
based = "University of Illinois System"
website = "https://igpa.uillinois.edu"
logo = "institute-for-government-and-public-affairs.png"
reviewed = false
bio = """Created in 1947 by the Illinois General Assembly and the University of Illinois Board of Trustees to study government, with a focus that soon settled on state and local government in Illinois. It is a nonpartisan research institute that now draws on more than 150 scholars across the University of Illinois System. It helped prepare for and staff the state's constitutional convention, and it incubated the Illinois Legislative Internship Program and Illinois Issues magazine."""
sources = ["https://igpa.uillinois.edu/history"]

[[org]]
name = "UIC Institute for Policy and Civic Engagement"
official_name = "Institute for Policy and Civic Engagement (IPCE), University of Illinois Chicago"
based = "Chicago"
website = "https://ipce.uic.edu"
logo = ""   # the website only offers a stock photo; add the official logo here when you have it
reviewed = false
bio = """A research institute in UIC's College of Urban Planning and Public Affairs that works on civic engagement and democracy. It brings together scholars, students, residents and public officials for research and programs on policy issues and social trends, publishes reports and briefs with community partners, and funds civic engagement research by UIC faculty."""
sources = ["https://ipce.uic.edu/about/", "https://cuppa.uic.edu/our-research/institute-for-policy-and-civic-engagement/"]

[[org]]
name = "Chicago Urban League"
official_name = "Chicago Urban League"
founded = 1916
based = "Chicago"
website = "https://chiul.org"
logo = "chicago-urban-league.jpg"
reviewed = false
bio = """Founded in 1916 by sociologists, social workers and philanthropists to meet the needs of African Americans arriving in Chicago during the Great Migration, and incorporated in 1917 as one of the first affiliates of the National Urban League. It works for the economic, educational and social progress of African Americans through programs, research and advocacy."""
sources = ["https://www.macfound.org/grantee/chicago-urban-league-287/", "https://digital.library.uic.edu/browse/collection/33/time"]

[[org]]
name = "Delta Institute"
official_name = "Delta Institute"
founded = 1998
based = "Chicago"
website = "https://delta-institute.org"
logo = "delta-institute.png"
reviewed = false
bio = """A nonprofit, founded in 1998, that works with communities, businesses and governments across the Midwest and Great Lakes region on environmental, economic and climate challenges. Its work spans energy, ecosystems and waste. It has led Great Lakes Restoration Initiative projects and incubated social enterprises such as the Rebuilding Exchange, a building-materials reuse store."""
sources = ["https://www.guidestar.org/profile/36-4210191", "https://delta-institute.org/wp-content/uploads/2024/02/Deltas-25th-Anniversary-Sponsorship-Opportunities.pdf"]
